<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/api/graphics/runtime.js"></script>
<script src="/graphics-lib/_shared/kit.js"></script>
<link rel="stylesheet" href="/graphics-lib/_shared/kit.css">
<style>
  .wrap { position: absolute; top: 50%; transform: translateY(-50%); }
  .wrap.right { right: 110px; } .wrap.left { left: 110px; } .wrap.center { left: 50%; transform: translate(-50%, -50%); }
  .panel { width: 780px; padding: 44px 52px 34px; animation: slide-in .55s var(--ease) both; }
  h1 { margin: 0 0 22px; font-size: 54px; font-weight: 700; color: var(--accent); line-height: 1.3; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 22px; margin: 16px 0; font-size: 40px; font-weight: 500; line-height: 1.35; animation: rise .45s var(--ease) both; }
  .n { flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 34px; }
</style>
</head>
<body>
<script>
  const { data, el, stagger, delay } = kit;
  const steps = data.steps || ['الخطوة الأولى', 'الخطوة الثانية', 'الخطوة الثالثة'];
  const wrap = el('div', `wrap leave ${kit.side(data.position, 'start')}`);
  const panel = el('div', 'panel', undefined, 'panel');
  if (data.title !== '') panel.append(el('h1', '', data.title ?? 'الخطوات', 'title'));
  const ol = el('ol');
  const at = stagger(steps.length, 0.6, 1.4);
  steps.forEach((s, i) => {
    const li = delay(el('li', '', undefined, `step-${i + 1}`), at[i]);
    li.append(el('span', 'n', i + 1, `step-${i + 1}-number`), el('span', '', s, `step-${i + 1}-text`));
    ol.append(li);
  });
  kit.scenes([['العنوان', 0], ...steps.map((_, i) => [`الخطوة ${i + 1}`, at[i]])]);
  panel.append(ol);
  wrap.append(panel);
  document.body.append(wrap);
</script>
</body>
</html>
